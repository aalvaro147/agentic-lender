# AL-Web CI: lint, format check, tests and build on every pull request and push to main.
# --if-present: skips scripts that don't exist yet on this branch (e.g. main before WEB-03-05 is merged).
# Story: WEB-06
name: AL-Web CI

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'

jobs:
  web:
    name: Lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (exact versions from package-lock)
        run: npm ci

      - name: Lint (Oxlint)
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npm run format:check --if-present

      - name: Run tests (Vitest)
        run: npm run test:run --if-present

      - name: Build
        run: npm run build